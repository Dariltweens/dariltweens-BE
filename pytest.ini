[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py tests.py
# Tests are function-style; only collect classes explicitly named *Tests. This
# also stops pytest trying to collect the Testimonial model as a test class.
python_classes = *Tests
addopts = --cov=catalog --cov=bookings --cov=content --cov=uploads --cov=core --cov=customers --cov=testimonials --cov=careers --cov=pricelist --cov=enquiries --cov-report=term-missing --reuse-db
markers =
    unit: isolated logic, no database
    integration: exercises the database or serializers end to end
